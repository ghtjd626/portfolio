# CI — lint · test · build (web · static client · mobile 번들)
# 독립 레포(ghtjd626/Lore)에서 push/PR마다 실행된다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (packages)
        run: pnpm lint

      - name: Unit tests (schema-core)
        run: pnpm --filter @lore/schema-core test

      - name: Build web (Next standalone, includes type-check)
        run: pnpm --filter @lore/web build

      - name: Build static client
        run: pnpm --filter @lore/web-static build

      - name: Type-check mobile
        run: pnpm --filter @lore/mobile type-check
